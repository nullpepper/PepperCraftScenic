<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>404 · 这个坐标不存在 | PepperCraft</title>
    <meta name="description" content="页面没有找到。回到 PepperCraft 首页，或者直接进服看看。" />
    <meta name="theme-color" content="#07120f" />
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
    <link rel="preload" href="/assets/fonts/pepper-sans-bold.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/assets/css/style.css" />
  </head>
  <body class="error-page">
    <header class="site-head is-scrolled">
      <div class="wrap head-inner">
        <a class="brand" href="/" aria-label="PepperCraft 首页">
          <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
            <rect x="15" y="2" width="3" height="5" fill="currentColor" />
            <rect x="19" y="4" width="4" height="3" fill="#b7d69a" />
            <path fill="#e07a50" d="M9 9h5V7h7v2h4v4h-2v12h-3v3h-7v-3H9V9z" />
            <path fill="#f6b18e" d="M14 12h4v3h-4z" />
          </svg>
          <span>PepperCraft</span>
        </a>
        <a class="error-back" href="/">返回首页</a>
      </div>
    </header>

    <main class="error-main">
      <div class="wrap">
        <p class="error-code">404 / NOT FOUND</p>
        <h1>这个坐标<br />不存在。</h1>
        <p>页面可能被搬走，或者地址少了一个字母。回到首页，或者直接进服看看。</p>
        <div class="error-actions">
          <a class="button button-light" href="/">回到首页</a>
          <button class="button button-ghost" type="button" data-copy="pepper.ltd">
            复制服务器地址
          </button>
        </div>
      </div>
    </main>

    <footer class="error-footer">
      <div class="wrap">
        <p>PepperCraft · 世界很大，慢慢生活。</p>
      </div>
    </footer>

    <div class="copy-live sr-only" aria-live="polite" id="copy-live"></div>
    <script src="/assets/js/main.js" defer></script>
  </body>
</html>
