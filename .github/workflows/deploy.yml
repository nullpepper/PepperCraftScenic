name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # 预览部署先移除 CNAME：web.pepper.ltd 目前仍指向 Vercel 并 307 到 www。
      # 正式切域名时删除这一步，并把 CNAME 一起发布。
      - name: Remove CNAME for preview deployment
        run: rm -f CNAME
      # 预览在 /PepperCraftScenic/ 子路径下，404 的根绝对资源会失效；仅预览改成相对。
      - name: Adjust 404 for project-subpath preview
        run: |
          sed -i \
            -e 's#href="/assets/#href="assets/#g' \
            -e 's#src="/assets/#src="assets/#g' \
            -e 's#href="/"#href="./"#g' \
            404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
